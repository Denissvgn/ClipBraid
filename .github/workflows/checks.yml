name: Required checks
on:
  pull_request:
  push:
    branches-ignore: [main, master, trunk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-checks:
    runs-on: ubuntu-24.04
    # The expanded editing/browser gate retains a 22-minute ceiling; allow setup and other gates too.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.11.1
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm run audit:dependencies
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify native Apple Silicon runtime
        run: |
          test "$(uname -m)" = arm64
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform, "darwin"); assert.equal(process.arch, "arm64"); console.log(JSON.stringify({platform: process.platform, arch: process.arch, node: process.version, executable: process.execPath}));'
          sw_vers
      - run: npm install --global npm@11.11.1
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm run audit:dependencies
# Detailed reports, source indexes and screenshots remain local/ephemeral.
# This workflow does not upload internal artifacts to the public repository.
