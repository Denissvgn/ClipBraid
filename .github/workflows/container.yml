name: Container checks
on:
  pull_request:
  push:
    branches-ignore: [main, master, trunk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: node scripts/docker-context.mjs --check
      - run: docker compose config --quiet
      - run: docker build --tag clipbraid:ci .
      - run: node scripts/check-container.mjs clipbraid:ci
# Build and test locally on the runner; no image publication or artifact uploads.
