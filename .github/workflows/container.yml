name: Container checks
on:
  pull_request:
  push:
    branches-ignore: [main, master, trunk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: node scripts/docker-context.mjs --check
      - run: docker compose config --quiet
      - run: docker build --platform linux/amd64 --tag clipbraid:ci .
      - run: node scripts/check-container.mjs clipbraid:ci
  container-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      DOCKER_DEFAULT_PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify native ARM64 build host
        run: |
          test "$(uname -m)" = aarch64
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform, "linux"); assert.equal(process.arch, "arm64"); console.log(JSON.stringify({platform: process.platform, arch: process.arch, node: process.version, executable: process.execPath}));'
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/arm64
      - run: node scripts/docker-context.mjs --check
      - run: docker compose config --quiet
      - run: docker build --platform linux/arm64 --tag clipbraid:ci-arm64 .
      - run: node scripts/check-container.mjs clipbraid:ci-arm64
# Build and test locally on the runner; no image publication or artifact uploads.
