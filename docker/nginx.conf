worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only successful, fingerprinted build assets receive a long cache lifetime.
    map "$status:$uri" $clipbraid_cache_control {
        default "no-store";
        "200:/" "no-cache";
        "200:/index.html" "no-cache";
        "~^200:/assets/" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        server_tokens off;
        root /usr/share/clipbraid;
        index index.html;

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $clipbraid_cache_control always;

        gzip on;
        gzip_vary on;
        gzip_types application/javascript text/javascript text/css image/svg+xml;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
